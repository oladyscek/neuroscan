services:
  app:
    build: .
    container_name: neuroscan-app
    restart: unless-stopped
    environment:
      DB_PATH: /app/data/database.db
    volumes:
      # Персистентное хранилище для SQLite
      - db_data:/app/data
    expose:
      - "8080"
    # Наружу порт не пробрасываем — доступ только через Caddy
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: neuroscan-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Раскомментируй, если используешь "Caddy отдаёт статику сам":
      # - ./static:/srv:ro
    depends_on:
      - app
    networks:
      - internal

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge